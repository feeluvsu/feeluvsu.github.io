<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKED BY ŞAHDAMAR</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .message {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #eaffea;
      font-family: "Courier New", monospace;
      font-size: clamp(2rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: .04em;
      text-align: center;
      white-space: nowrap;
      text-shadow:
        0 0 5px #baffba,
        0 0 12px #00ff41,
        0 0 28px #00ff41,
        0 0 55px #008f11;
      animation: flicker 3s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; }
      20%, 63% { opacity: .82; }
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="message">HACKED BY ŞAHDAMAR</div>
  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%";
    const fontSize = 16;
    let columns = 0;
    let drops = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      columns = Math.ceil(innerWidth / fontSize);
      drops = Array.from({ length: columns }, () =>
        Math.random() * -(innerHeight / fontSize)
      );
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.075)";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = Math.random() > 0.97 ? "#d7ffdf" : "#00ff41";
        ctx.fillText(char, x, y);

        if (y > innerHeight && Math.random() > 0.975) {
          drops[i] = 0;
        } else {
          drops[i] += 0.65 + Math.random() * 0.45;
        }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
